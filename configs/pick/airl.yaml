project: 'FA-OPD'
program: faopd/main.py
method: grid
name: Pick-airl-1.00
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
  - --use-proper-time-limits

parameters:
  prefix:
    value: airl
  alg:
    value: airl
  num-mini-batch:
    value: 32
  entropy-coef:
    value: 0.0001
  env-name:
    value: FetchPickAndPlaceDiffHoldout-v0
  num-env-steps:
    value: 10000000
  cuda:
    value: False
  traj-load-path:
    value: ./expert_datasets/pick_10000.pt
  eval-num-processes:
    value: 1
  num-render:
    value: 1
  num-eval:
    value: 100
  eval-interval:
    value: 1000
  save-interval:
    value: 1000
  lr:
    value: 0.00005
  num-epochs:
    value: 10
  noise-ratio:
    value: 1.0
  goal-noise-ratio:
    value: 1.0
  seed:
    values: [1,2,3,4]