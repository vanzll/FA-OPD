project: 'FA-OPD'
program: faopd/main.py
method: grid
name: Walker-ppo
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
  
parameters:
  alg:
    value: ppo
  clip-actions:
    value: true
  cuda:
    value: true
  entropy-coef:
    value: 0.001
  env-name:
    #value: Walker2d-v3
    value: halfcheetah-medium-v0
  eval-interval:
    value: 20000
  eval-num-processes:
    value: 1
  log-interval:
    value: 1
  lr:
    value: 0.0001
  max-grad-norm:
    value: 0.5
  normalize-env:
    value: true
  num-env-steps:
    value: 8000000
  num-epochs:
    value: 10
  num-eval:
    value: 2
  num-mini-batch:
    value: 32
  num-render:
    value: 1000
  num-steps:
    value: 256
  ppo-hidden-dim:
    value: 256
  prefix:
    value: ppo
  save-interval:
    value: 100000
  seed:
    value: 1
  vid-fps:
    value: 100
    